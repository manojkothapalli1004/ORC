name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install project
        run: |
          uv sync
          uv pip install -e .
          uv pip install pytest

      - name: Syntax check all Python files
        run: |
          uv run python -m compileall backend tests

      - name: Run tests
        run: |
          uv run pytest -v

      - name: CLI smoke test
        run: |
          uv run orc version
          uv run orc --help
